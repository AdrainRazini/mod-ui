    /*

    UTILIDADES
    ============================================================

    function removerComentarios(lua) {

        // Remove comentários -- até o final da linha

        return lua.replace(
            /--.*$/gm,
            ""
        );
    }


    /*
    ============================================================
    EXPRESSÃO MATEMÁTICA SEGURA
    ============================================================
    */

    function calcularExpressaoTempo(expressao) {

        /*
            Aceita somente:

            números
            +
            -
            *
            /
            espaços
            parênteses
            ponto decimal

            Exemplos:

            60 * 60 * 24 * 30
            60 * 60 * 24
            (60 * 60) + 30
        */


        const limpa =
            expressao
                .replace(/\s/g, "");


        if (
            !/^[0-9+\-*/().]+$/.test(limpa)
        ) {

            throw new Error(
                "Expressão de tempo inválida."
            );
        }


        /*
            Parser matemático simples.

            Não utiliza eval()
            nem Function().
        */

        let pos = 0;


        function parseNumero() {

            const inicio =
                pos;


            while (
                pos < limpa.length &&
                /[0-9.]/.test(limpa[pos])
            ) {
                pos++;
            }


            const valor =
                Number(
                    limpa.slice(
                        inicio,
                        pos
                    )
                );


            if (
                !Number.isFinite(valor)
            ) {

                throw new Error(
                    "Número inválido na expressão."
                );
            }


            return valor;
        }


        function parseFator() {

            if (
                limpa[pos] === "("
            ) {

                pos++;

                const valor =
                    parseSoma();


                if (
                    limpa[pos] !== ")"
                ) {

                    throw new Error(
                        "Parêntese inválido."
                    );
                }


                pos++;

                return valor;
            }


            if (
                limpa[pos] === "-"
            ) {

                pos++;

                return -parseFator();
            }


            return parseNumero();
        }


        function parseMultiplicacao() {

            let valor =
                parseFator();


            while (
                limpa[pos] === "*" ||
                limpa[pos] === "/"
            ) {

                const operador =
                    limpa[pos];

                pos++;


                const proximo =
                    parseFator();


                if (
                    operador === "*"
                ) {

                    valor *= proximo;

                } else {

                    valor /= proximo;
                }
            }


            return valor;
        }


        function parseSoma() {

            let valor =
                parseMultiplicacao();


            while (
                limpa[pos] === "+" ||
                limpa[pos] === "-"
            ) {

                const operador =
                    limpa[pos];

                pos++;


                const proximo =
                    parseMultiplicacao();


                if (
                    operador === "+"
                ) {

                    valor += proximo;

                } else {

                    valor -= proximo;
                }
            }


            return valor;
        }


        const resultado =
            parseSoma();


        if (
            pos !== limpa.length
        ) {

            throw new Error(
                "Expressão matemática inválida."
            );
        }


        if (
            !Number.isFinite(resultado)
        ) {

            throw new Error(
                "Resultado matemático inválido."
            );
        }


        return resultado;
    }


    /*
    ============================================================
    EXPIRAÇÃO LUA
    ============================================================
    */

    function converterExpiracao(valor) {

        /*
            Exemplo:

            os.time() + (60 * 60 * 24 * 30)

            vira:

            timestamp atual + 30 dias
        */


        if (
            typeof valor !== "string" ||
            !valor.includes("os.time()")
        ) {

            return valor;
        }


        const expressao =
            valor
                .replace(
                    "os.time()",
                    ""
                )
                .replace(
                    "+",
                    ""
                )
                .trim();


        if (!expressao) {

            return Math.floor(
                Date.now() / 1000
            );
        }


        try {

            const segundos =
                calcularExpressaoTempo(
                    expressao
                );


            return Math.floor(
                Date.now() / 1000
            ) + Math.floor(segundos);


        } catch (error) {

            console.error(
                "Erro ao converter Expiration:",
                error
            );


            return Math.floor(
                Date.now() / 1000
            );
        }
    }


    /*
    ============================================================
    API ROBLOX
    ============================================================
    */

    async function buscarUGC(IdUGC) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 5000);

    try {
        const response = await fetch(
            `https://mod-ui.vercel.app/ugcs/${IdUGC}`,
            {
                signal: controller.signal
            }
        );

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const result = await response.json();

        if (!result.success || !result.data) {
            throw new Error(result.message || "UGC não encontrado");
        }

        return result.data;

    } finally {
        clearTimeout(timeout);
    }
}

            CollectibleItemId:
                roblox.CollectibleItemId ?? null,

            CollectibleProductId:
                roblox.CollectibleProductId ?? null,


            CollectiblesItemDetails: {

    /*
    ============================================================
    VALIDAR LISTA COM ROBLOX
    ============================================================
    */

    async function validarListaComRoblox(List) {

        const entries =
            Object.entries(List);


        if (
            entries.length === 0
        ) {

            throw new Error(
                "A lista está vazia."
            );
        }


        /*
            Faz todas as consultas ao mesmo tempo.

            Isso é importante porque a API possui
            limite de aproximadamente 5 segundos.
        */

        const resultados =
            await Promise.allSettled(

                entries.map(
                    async ([nome, item]) => {

                        if (
                            !item ||
                            !item.IdUGC
                        ) {

                            throw new Error(
                                `${nome}: IdUGC não informado.`
                            );
                        }


                        const IdUGC =
                            Number(item.IdUGC);


                        if (
                            !Number.isInteger(IdUGC) ||
                            IdUGC <= 0
                        ) {

                            throw new Error(
                                `${nome}: IdUGC inválido.`
                            );
                        }


                        const roblox =
                            await buscarUGC(
                                IdUGC
                            );


                        return {

                            nome,

                            item,

                            roblox:
                                extrairDadosRoblox(
                                    roblox
                                )
                        };
                    }
                )
            );


        const erros = [];


        const atualizada = {};


        resultados.forEach(
            (resultado, index) => {

                const [
                    nome,
                    item
                ] = entries[index];


                if (
                    resultado.status ===
                    "rejected"
                ) {

                    erros.push({

                        nome,

                        IdUGC:
                            item?.IdUGC ??
                            null,

                        erro:
                            resultado
                                .reason
                                ?.message ||
                            "Erro desconhecido."
                    });


                    return;
                }


                const roblox =
                    resultado.value.roblox;


                atualizada[nome] = {

                    ...item,


                    /*
                        Mantém os dados
                        configurados pelo jogo.

                        Adiciona os dados
                        vindos do Roblox.
                    */

                    Roblox: roblox
                };
            }
        );


        /*
            Se um único UGC falhar,
            não permitimos salvar.

            Isso evita salvar uma lista
            parcialmente validada.
        */

        if (
            erros.length > 0
        ) {

            const detalhes =
                erros
                    .map(
                        erro =>
                            `${erro.nome} (${erro.IdUGC}): ${erro.erro}`
                    )
                    .join("\n");


            throw new Error(
                `Não foi possível validar ${erros.length} UGC(s):\n\n${detalhes}`
            );
        }


        return {

            List:
                atualizada,

            erros: []
        };
    }


    /*
    ============================================================
    PARSER LUA
    ============================================================
    */

    function parseLuaTable(lua) {

        lua =
            removerComentarios(lua);


        /*
            Localiza o primeiro {
        */

        const inicio =
            lua.indexOf("{");


        if (
            inicio === -1
        ) {

            throw new Error(
                "Não encontrei a tabela { do List."
            );
        }


        /*
            Parser simples para o formato
            usado no seu catálogo.
        */

        let pos =
            inicio;


        function ignorarEspacos() {

            while (
                pos < lua.length &&
                /\s/.test(lua[pos])
            ) {

                pos++;
            }
        }


        function lerString() {

            ignorarEspacos();


            const quote =
                lua[pos];


            pos++;


            let resultado =
                "";


            while (
                pos < lua.length
            ) {

                const char =
                    lua[pos];


                if (
                    char === "\\"
                ) {

                    resultado +=
                        lua[pos + 1];


                    pos += 2;


                    continue;
                }


                if (
                    char === quote
                ) {

                    pos++;

                    break;
                }


                resultado +=
                    char;


                pos++;
            }


            return resultado;
        }


        function lerNumeroOuExpressao() {

            ignorarEspacos();


            const inicioValor =
                pos;


            let parenteses =
                0;


            while (
                pos < lua.length
            ) {

                const char =
                    lua[pos];


                if (
                    char === "("
                ) {

                    parenteses++;

                }


                if (
                    char === ")"
                ) {

                    parenteses--;
                }


                if (
                    parenteses === 0 &&
                    (
                        char === "," ||
                        char === "\n" ||
                        char === "}"
                    )
                ) {

                    break;
                }


                pos++;
            }


            return lua
                .slice(
                    inicioValor,
                    pos
                )
                .trim();
        }


        function lerIdentificador() {

            ignorarEspacos();


            const inicioValor =
                pos;


            while (
                pos < lua.length &&
                /[A-Za-z0-9_]/.test(
                    lua[pos]
                )
            ) {

                pos++;
            }


            return lua.slice(
                inicioValor,
                pos
            );
        }


        function lerTabela() {

            ignorarEspacos();


            if (
                lua[pos] !== "{"
            ) {

                throw new Error(
                    "Esperava { na posição " +
                    pos
                );
            }


            pos++;


            const objeto =
                {};


            while (
                pos < lua.length
            ) {

                ignorarEspacos();


                if (
                    lua[pos] === "}"
                ) {

                    pos++;

                    break;
                }


                /*
                    Chave:

                    ["Nome"]
                */

                let chave;


                if (
                    lua[pos] === "["
                ) {

                    pos++;


                    ignorarEspacos();


                    chave =
                        lerString();


                    ignorarEspacos();


                    if (
                        lua[pos] === "]"
                    ) {

                        pos++;
                    }
                }


                /*
                    Chave normal
                */

                else {

                    chave =
                        lerIdentificador();
                }


                if (
                    !chave
                ) {

                    throw new Error(
                        `Chave inválida na posição ${pos}.`
                    );
                }


                ignorarEspacos();


                if (
                    lua[pos] !== "="
                ) {

                    throw new Error(
                        `Esperava = depois da chave "${chave}"`
                    );
                }


                pos++;


                ignorarEspacos();


                /*
                    Valor é tabela
                */

                if (
                    lua[pos] === "{"
                ) {

                    objeto[chave] =
                        lerTabela();
                }


                /*
                    Valor string
                */

                else if (
                    lua[pos] === '"' ||
                    lua[pos] === "'"
                ) {

                    objeto[chave] =
                        lerString();
                }


                /*
                    Valor boolean,
                    número ou expressão
                */

                else {

                    const valor =
                        lerNumeroOuExpressao();


                    if (
                        valor === "true"
                    ) {

                        objeto[chave] =
                            true;
                    }


                    else if (
                        valor === "false"
                    ) {

                        objeto[chave] =
                            false;
                    }


                    else if (
                        valor === "nil"
                    ) {

                        objeto[chave] =
                            null;
                    }


                    else if (
                        valor.includes(
                            "os.time()"
                        )
                    ) {

                        objeto[chave] =
                            converterExpiracao(
                                valor
                            );
                    }


                    else if (
                        /^-?\d+(\.\d+)?$/
                            .test(valor)
                    ) {

                        objeto[chave] =
                            Number(valor);
                    }


                    else {

                        objeto[chave] =
                            valor;
                    }
                }


                ignorarEspacos();


                if (
                    lua[pos] === ","
                ) {

                    pos++;
                }
            }


            return objeto;
        }


        return lerTabela();
    }

                        }

                    </span>
                </div>


                <div class="row">
                    <span class="label">
                        Market
                    </span>

                    <span>
                        ${ugc.MarketType ?? "-"}
                    </span>
                </div>


                <div class="row">
                    <span class="label">
                        Stock
                    </span>

                    <span>
                        ${ugc.MaxStock ?? "∞"}
                    </span>
                </div>


                <pre>${escapeHtml(
                    JSON.stringify(
                        ugc,
                        null,
                        2
                    )
                )}</pre>

            `;


            container.appendChild(
                card
            );
        }
    }


    function escapeHtml(text) {

        return String(text)
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );
    }


    /*
    ============================================================
    CARREGAR LUA
    ============================================================
    */

    window.carregarLua =
        function () {

            const input =
                document.getElementById(
                    "lua-input"
                );


            const status =
                document.getElementById(
                    "preview-status"
                );


            try {

                if (
                    !input.value.trim()
                ) {

                    throw new Error(
                        "Cole uma lista Lua primeiro."
                    );
                }


                const List =
                    parseLuaTable(
                        input.value
                    );


                mostrarLista(
                    List
                );


                status.innerText =
                    `${Object.keys(List).length} UGCs encontrados no Lua.`;


                console.log(
                    "List convertido:",
                    List
                );


            } catch (error) {

                console.error(
                    error
                );


                status.innerText =
                    "Erro ao interpretar o Lua: " +
                    error.message;
            }
        };


    /*
    ============================================================
    SALVAR FIREBASE
    ============================================================
    */

    window.salvarFirebase =
        async function () {

            const user =
                auth.currentUser;


            if (
                !user
            ) {

                alert(
                    "Você precisa estar autenticado."
                );


                return;
            }


            if (
                !currentList
            ) {

                alert(
                    "Carregue uma lista primeiro."
                );


                return;
            }


            const status =
                document.getElementById(
                    "preview-status"
                );


            try {

                /*
                    ====================================================
                    ETAPA 1
                    Validar lista com a API
                    ====================================================
                */

                status.innerText =
                    `Validando ${Object.keys(currentList).length} UGCs no Roblox...`;


                console.log(
                    "Iniciando validação dos UGCs..."
                );


                const resultado =
                    await validarListaComRoblox(
                        currentList
                    );


                /*
                    ====================================================
                    ETAPA 2
                    Atualizar preview com os dados Roblox
                    ====================================================
                */

                currentList =
                    resultado.List;


                mostrarLista(
                    currentList
                );


                status.innerText =
                    "UGCs validados com sucesso. Salvando no Firebase...";


                /*
                    ====================================================
                    ETAPA 3
                    Salvar
                    ====================================================
                */

                const ref =
                    doc(
                        db,
                        "arrays",
                        "ugcs"
                    );


                await setDoc(
                    ref,
                    {

                        ownerId:
                            user.uid,

                        name:
                            "UGCS_DATA",

                        version:
                            1,

                        updatedAt:
                            serverTimestamp(),

                        data:
                            currentList

                    }
                );


                /*
                    ====================================================
                    SUCESSO
                    ====================================================
                */

                status.innerText =
                    `${Object.keys(currentList).length} UGCs validados e salvos no Firebase.`;


                console.log(
                    "UGCs validados e salvos:",
                    currentList
                );


                alert(
                    "UGCS_DATA validado e salvo com sucesso!"
                );


            } catch (error) {

                console.error(
                    "Erro ao validar/salvar:",
                    error
                );


                /*
                    Importante:

                    currentList NÃO é salvo se a API
                    retornar erro ou ultrapassar o timeout.
                */

                status.innerText =
                    "Falha na validação: " +
                    error.message;


                alert(
                    "A lista NÃO foi salva.\n\n" +
                    error.message
                );
            }
        };


    /*
    ============================================================
    CARREGAR FIREBASE
    ============================================================
    */

    window.carregarFirebase =
        async function () {

            try {

                const ref =
                    doc(
                        db,
                        "arrays",
                        "ugcs"
                    );


                const snap =
                    await getDoc(
                        ref
                    );


                if (
                    !snap.exists()
                ) {

                    alert(
                        "Documento arrays/ugcs não existe."
                    );


                    return;
                }


                const documento =
                    snap.data();


                const List =
                    documento.data || {};


                mostrarLista(
                    List
                );


                console.log(
                    "Firebase:",
                    documento
                );


            } catch (error) {

                console.error(
                    error
                );


                alert(
                    "Erro ao carregar Firebase."
                );
            }
        };


    /*
    ============================================================
    LIMPAR
    ============================================================
    */

    window.limparPreview =
        function () {

            currentList =
                null;


            document.getElementById(
                "ugc-list"
            ).innerHTML =
                "";


            document.getElementById(
                "preview-status"
            ).innerText =
                "Nenhuma lista carregada.";
        };


    /*
    ============================================================
    AUTENTICAÇÃO + ADMIN
    ============================================================
    */

    onAuthStateChanged(
        auth,
        async (user) => {

            const status =
                document.getElementById(
                    "status"
                );


            const panel =
                document.getElementById(
                    "admin-panel"
                );


            if (
                !user
            ) {

                status.innerText =
                    "Usuário não autenticado.";


                return;
            }


            try {

                const userRef =
                    doc(
                        db,
                        "users",
                        user.uid
                    );


                const userSnap =
                    await getDoc(
                        userRef
                    );


                if (
                    !userSnap.exists()
                ) {

                    status.innerText =
                        "Perfil do usuário não encontrado.";


                    return;
                }


                const userData =
                    userSnap.data();


                const role =
                    userData.role ||
                    "user";


                if (
                    role !== "admin"
                ) {

                    status.innerText =
                        "Acesso negado. Área administrativa.";


                    return;
                }


                status.innerText =
                    `Admin autenticado: ${
                        user.displayName ||
                        user.email ||
                        user.uid
                    }`;


                panel.classList.remove(
                    "hidden"
                );


                /*
                    Carrega automaticamente
                    o documento existente.
                */

                await carregarFirebase();


            } catch (error) {

                console.error(
                    error
                );


                status.innerText =
                    "Erro ao verificar permissão.";
            }
        }
    );

</script>
