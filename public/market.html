<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ADN Market — UGCs</title>

    <link rel="shortcut icon" href="image/Cube.ico" type="image/x-icon">

    <style>
        :root {
            --bg: #07090d;
            --panel: #0d1118;
            --panel-2: #111722;
            --border: #1d2735;
            --text: #f2f5f8;
            --muted: #8995a5;
            --primary: #00e5ff;
            --success: #48e28a;
            --danger: #ff5f6d;
            --warning: #ffc857;
            --shadow: 0 15px 45px rgba(0, 0, 0, .35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(0, 229, 255, .07),
                    transparent 30%
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(125, 70, 255, .06),
                    transparent 30%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        header {
            position: sticky;
            top: 0;
            z-index: 50;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            min-height: 70px;

            padding: 12px 5%;

            background: rgba(7, 9, 13, .88);

            backdrop-filter: blur(16px);

            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;

            gap: 12px;

            font-size: 20px;
            font-weight: 800;
            letter-spacing: .5px;
        }

        .brand-logo {
            width: 38px;
            height: 38px;

            display: grid;
            place-items: center;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #716cff
                );

            color: #001015;

            font-weight: 900;
        }

        .brand span {
            color: var(--primary);
        }

        .header-status {
            color: var(--muted);
            font-size: 13px;
        }

        /* =====================================================
           HERO
        ===================================================== */

        .hero {
            max-width: 1400px;

            margin: 0 auto;

            padding: 55px 5% 30px;
        }

        .hero h1 {
            font-size: clamp(30px, 5vw, 54px);

            line-height: 1;

            margin-bottom: 14px;
        }

        .hero h1 strong {
            color: var(--primary);
        }

        .hero p {
            max-width: 750px;

            color: var(--muted);

            line-height: 1.6;
        }

        /* =====================================================
           SEARCH
        ===================================================== */

        .controls {
            max-width: 1400px;

            margin: 0 auto;

            padding: 10px 5% 30px;

            display: flex;

            gap: 12px;

            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;

            min-width: 240px;
        }

        .search-box input {
            width: 100%;

            height: 46px;

            padding: 0 16px;

            border: 1px solid var(--border);

            border-radius: 10px;

            outline: none;

            background: var(--panel);

            color: var(--text);

            transition: .2s;
        }

        .search-box input:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 3px
                rgba(0, 229, 255, .08);
        }

        .filter-button {
            height: 46px;

            padding: 0 18px;

            border: 1px solid var(--border);

            border-radius: 10px;

            background: var(--panel);

            color: var(--text);

            cursor: pointer;

            transition: .2s;
        }

        .filter-button:hover {
            border-color: var(--primary);

            color: var(--primary);
        }

        /* =====================================================
           MAIN
        ===================================================== */

        main {
            max-width: 1400px;

            margin: 0 auto;

            padding: 0 5% 70px;
        }

        .market-info {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 15px;

            margin-bottom: 20px;

            color: var(--muted);

            font-size: 14px;
        }

        #item-count {
            color: var(--primary);

            font-weight: 700;
        }

        #preview-status {
            text-align: right;
        }

        /* =====================================================
           GRID
        ===================================================== */

        #ugc-list {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(210px, 1fr)
                );

            gap: 18px;
        }

        /* =====================================================
           CARD
        ===================================================== */

        .ugc-card {
            overflow: hidden;

            border: 1px solid var(--border);

            border-radius: 14px;

            background:
                linear-gradient(
                    180deg,
                    var(--panel-2),
                    var(--panel)
                );

            box-shadow: var(--shadow);

            transition:
                transform .2s,
                border-color .2s,
                box-shadow .2s;
        }

        .ugc-card:hover {
            transform: translateY(-4px);

            border-color:
                rgba(0, 229, 255, .45);

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, .45);
        }

        .ugc-thumbnail {
            position: relative;

            aspect-ratio: 1 / 1;

            overflow: hidden;

            background: #090d13;
        }

        .ugc-thumbnail img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            transition: transform .3s;
        }

        .ugc-card:hover
        .ugc-thumbnail img {
            transform: scale(1.04);
        }

        .thumbnail-placeholder {
            width: 100%;
            height: 100%;

            display: grid;
            place-items: center;

            color: #536071;

            font-size: 13px;
        }

        /* =====================================================
           BADGES
        ===================================================== */

        .badge {
            position: absolute;

            top: 10px;
            right: 10px;

            padding: 6px 8px;

            border-radius: 7px;

            background:
                rgba(0, 0, 0, .78);

            backdrop-filter: blur(8px);

            font-size: 10px;

            font-weight: 800;

            text-transform: uppercase;
        }

        .badge.api {
            color: var(--primary);
        }

        .badge.saved {
            color: var(--success);
        }

        .price {
            position: absolute;

            left: 10px;
            bottom: 10px;

            padding: 6px 9px;

            border-radius: 7px;

            background:
                rgba(0, 0, 0, .75);

            color: #fff;

            font-size: 13px;

            font-weight: 700;

            backdrop-filter: blur(8px);
        }

        /* =====================================================
           CARD CONTENT
        ===================================================== */

        .card-content {
            padding: 14px;
        }

        .ugc-name {
            min-height: 42px;

            margin-bottom: 8px;

            color: var(--text);

            font-size: 15px;

            font-weight: 700;

            line-height: 1.4;

            display: -webkit-box;

            -webkit-line-clamp: 2;

            -webkit-box-orient: vertical;

            overflow: hidden;
        }

        .ugc-id {
            margin-bottom: 12px;

            color: var(--muted);

            font-size: 11px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }

        .card-actions {
            display: grid;

            gap: 8px;
        }

        .roblox-button {
            min-height: 38px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 8px;

            background: var(--primary);

            color: #001015;

            font-size: 13px;

            font-weight: 800;

            transition: .2s;
        }

        .roblox-button:hover {
            background: #52edff;

            transform: translateY(-1px);
        }

        .details-button {
            min-height: 38px;

            border: 1px solid var(--border);

            border-radius: 8px;

            background: transparent;

            color: var(--muted);

            cursor: pointer;

            transition: .2s;
        }

        .details-button:hover {
            border-color: var(--primary);

            color: var(--primary);
        }

        /* =====================================================
           STATUS
        ===================================================== */

        .status {
            min-height: 260px;

            display: grid;

            place-items: center;

            text-align: center;

            color: var(--muted);
        }

        .status-content {
            max-width: 500px;
        }

        .status-title {
            margin-bottom: 8px;

            color: var(--text);

            font-size: 20px;

            font-weight: 800;
        }

        .status-text {
            line-height: 1.6;
        }

        .loading-spinner {
            width: 34px;
            height: 34px;

            margin: 0 auto 15px;

            border: 3px solid var(--border);

            border-top-color: var(--primary);

            border-radius: 50%;

            animation:
                spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =====================================================
           MODAL
        ===================================================== */

        .modal {
            position: fixed;

            inset: 0;

            z-index: 100;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(0, 0, 0, .72);

            backdrop-filter: blur(8px);
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            width: min(560px, 100%);

            max-height: 90vh;

            overflow-y: auto;

            padding: 22px;

            border: 1px solid var(--border);

            border-radius: 16px;

            background: var(--panel);

            box-shadow:
                0 30px 100px
                rgba(0, 0, 0, .6);
        }

        .modal-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 18px;
        }

        .modal-header h2 {
            font-size: 20px;
        }

        .close-modal {
            width: 34px;
            height: 34px;

            border: 1px solid var(--border);

            border-radius: 8px;

            background: transparent;

            color: var(--muted);

            cursor: pointer;

            font-size: 20px;
        }

        .close-modal:hover {
            color: var(--danger);

            border-color: var(--danger);
        }

        .modal-thumbnail {
            width: 180px;
            height: 180px;

            margin: 0 auto 20px;

            overflow: hidden;

            border-radius: 12px;

            background: #090d13;
        }

        .modal-thumbnail img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .details {
            display: grid;

            gap: 9px;
        }

        .detail-row {
            display: flex;

            justify-content: space-between;

            gap: 15px;

            padding: 10px 0;

            border-bottom:
                1px solid var(--border);

            font-size: 13px;
        }

        .detail-label {
            color: var(--muted);
        }

        .detail-value {
            max-width: 65%;

            color: var(--text);

            text-align: right;

            word-break: break-word;
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        footer {
            padding: 30px 5%;

            border-top: 1px solid var(--border);

            text-align: center;

            color: var(--muted);

            font-size: 12px;
        }

        footer strong {
            color: var(--primary);
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            header {
                padding: 10px 4%;
            }

            .header-status {
                display: none;
            }

            .hero {
                padding: 40px 4% 25px;
            }

            .controls {
                padding-left: 4%;
                padding-right: 4%;
            }

            main {
                padding-left: 4%;
                padding-right: 4%;
            }

            #ugc-list {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 10px;
            }

            .card-content {
                padding: 10px;
            }

            .ugc-name {
                font-size: 13px;
            }

            .roblox-button,
            .details-button {
                font-size: 11px;
            }
        }

        @media (max-width: 380px) {

            #ugc-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>


<body>

<script type="module">


/* ============================================================
   FIREBASE
============================================================ */

import {
    db
} from "./js/Auth.js";


import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/11.5.0/firebase-firestore.js";


/* ============================================================
   CONFIGURATION
============================================================ */

const FIRESTORE_COLLECTION =
    "arrays";

const FIRESTORE_DOCUMENT =
    "ugcs";


const API_BASE_URL =
    "https://mod-ui.vercel.app";


const API_TIMEOUT =
    8000;


/* ============================================================
   STATE
============================================================ */

let currentList = {};

let allItems = [];

let apiSearchItem = null;

let searchTimer = null;

let apiRequestController = null;


/* ============================================================
   ELEMENTS
============================================================ */

const ugcList =
    document.getElementById(
        "ugc-list"
    );


const marketStatus =
    document.getElementById(
        "market-status"
    );


const previewStatus =
    document.getElementById(
        "preview-status"
    );


const itemCount =
    document.getElementById(
        "item-count"
    );


const searchInput =
    document.getElementById(
        "search-input"
    );


const clearSearch =
    document.getElementById(
        "clear-search"
    );


const modal =
    document.getElementById(
        "details-modal"
    );


const modalTitle =
    document.getElementById(
        "modal-title"
    );


const modalImage =
    document.getElementById(
        "modal-image"
    );


const modalDetails =
    document.getElementById(
        "modal-details"
    );


const closeModal =
    document.getElementById(
        "close-modal"
    );


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ============================================================
   FORMAT
============================================================ */

function formatValue(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "N/A";
    }


    if (
        typeof value === "boolean"
    ) {

        return value
            ? "Yes"
            : "No";

    }


    if (
        typeof value === "object"
    ) {

        try {

            return JSON.stringify(
                value
            );

        } catch {

            return "[Object]";

        }

    }


    return String(value);

}


/* ============================================================
   ID
============================================================ */

function encontrarId(item) {

    return (
        item?.IdUGC ??
        item?.AssetId ??
        item?.assetId ??
        item?.TargetId ??
        item?.id ??
        item?.Id ??
        null
    );

}


/* ============================================================
   NAME
============================================================ */

function encontrarNome(item) {

    return (
        item?.Nome ??
        item?.Name ??
        item?.name ??
        item?.Roblox?.Nome ??
        item?.Roblox?.Name ??
        item?.Roblox?.name ??
        "Unnamed UGC"
    );

}


/* ============================================================
   THUMBNAIL
============================================================ */

function encontrarThumbnail(item) {

    return (
        item?.Thumbnail ??
        item?.thumbnail ??
        item?.Image ??
        item?.image ??
        item?.Roblox?.Thumbnail ??
        item?.Roblox?.thumbnail ??
        item?.Roblox?.Image ??
        null
    );

}


/* ============================================================
   PRICE
============================================================ */

function encontrarPreco(item) {

    const roblox =
        item?.Roblox || {};


    const collectible =
        item?.CollectiblesItemDetails ||
        roblox?.CollectiblesItemDetails ||
        {};


    return (
        item?.Preco ??
        item?.Price ??
        item?.PriceInRobux ??
        item?.price ??
        collectible?.Price ??
        collectible?.price ??
        roblox?.Price ??
        roblox?.PriceInRobux ??
        roblox?.price ??
        null
    );

}


/* ============================================================
   FETCH WITH TIMEOUT
============================================================ */

async function fetchComTimeout(
    url,
    options = {},
    timeout = API_TIMEOUT
) {

    const controller =
        new AbortController();


    const timer =
        setTimeout(
            () => controller.abort(),
            timeout
        );


    try {

        const response =
            await fetch(
                url,
                {
                    ...options,
                    signal:
                        controller.signal
                }
            );


        return response;

    } finally {

        clearTimeout(timer);

    }

}


/* ============================================================
   API — SEARCH UGC
============================================================ */

async function buscarUGC(
    assetId
) {

    if (!assetId) {
        return null;
    }


    /*
     * Cancel a previous request.
     */

    if (
        apiRequestController
    ) {

        apiRequestController.abort();

    }


    apiRequestController =
        new AbortController();


    const url =
        `${API_BASE_URL}/ugcs/${encodeURIComponent(assetId)}`;


    console.log(
        "[ADN Market] Querying API:",
        url
    );


    const response =
        await fetchComTimeout(
            url,
            {
                signal:
                    apiRequestController.signal
            }
        );


    if (!response.ok) {

        throw new Error(
            `API returned HTTP ${response.status}`
        );

    }


    const json =
        await response.json();


    /*
     * Confirmed API format:
     *
     * {
     *     success: true,
     *     data: {...}
     * }
     */

    if (
        !json ||
        json.success !== true ||
        !json.data
    ) {

        throw new Error(
            "UGC not found by the API."
        );

    }


    return json.data;

}


/* ============================================================
   API — THUMBNAIL
============================================================ */

async function buscarThumbnailRoblox(
    assetId
) {

    if (!assetId) {
        return null;
    }


    try {

        const response =
            await fetchComTimeout(
                `${API_BASE_URL}/thumbnail/${encodeURIComponent(assetId)}`
            );


        if (!response.ok) {
            return null;
        }


        const json =
            await response.json();


        if (
            json &&
            json.success &&
            json.imageUrl
        ) {

            return json.imageUrl;

        }


    } catch (error) {

        if (
            error?.name !== "AbortError"
        ) {

            console.warn(
                "[ADN Market] Error loading thumbnail:",
                assetId,
                error
            );

        }

    }


    return null;

}


/* ============================================================
   NORMALIZE ITEM
============================================================ */

function normalizarItem(
    item,
    chaveOriginal = null,
    origem = "firestore"
) {

    if (
        !item ||
        typeof item !== "object"
    ) {

        return null;

    }


    const id =
        encontrarId(item) ||
        chaveOriginal;


    if (!id) {
        return null;
    }


    return {

        original: item,

        key: chaveOriginal,

        id: id,

        nome:
            encontrarNome(item),

        thumbnail:
            encontrarThumbnail(item),

        preco:
            encontrarPreco(item),

        origem:
            origem

    };

}


/* ============================================================
   CONVERT FIRESTORE LIST
============================================================ */

function converterLista(data) {

    if (!data) {
        return [];
    }


    if (
        Array.isArray(data)
    ) {

        return data
            .map(
                (item, index) =>
                    normalizarItem(
                        item,
                        index,
                        "firestore"
                    )
            )
            .filter(Boolean);

    }


    if (
        typeof data === "object"
    ) {

        return Object.entries(data)
            .map(
                ([key, value]) =>
                    normalizarItem(
                        value,
                        key,
                        "firestore"
                    )
            )
            .filter(Boolean);

    }


    return [];

}


/* ============================================================
   FIRESTORE
============================================================ */

async function carregarMercado() {

    try {

        const referencia =
            doc(
                db,
                FIRESTORE_COLLECTION,
                FIRESTORE_DOCUMENT
            );


        const snapshot =
            await getDoc(
                referencia
            );


        if (
            !snapshot.exists()
        ) {

            throw new Error(
                "The arrays/ugcs document does not exist."
            );

        }


        const documento =
            snapshot.data();


        currentList =
            documento.data || {};


        allItems =
            converterLista(
                currentList
            );


        itemCount.textContent =
            allItems.length;


        previewStatus.textContent =
            `${allItems.length} registered items`;


        marketStatus.style.display =
            "none";


        renderizarItens(
            allItems
        );


    } catch (error) {

        console.error(
            "[ADN Market] Firestore error:",
            error
        );


        marketStatus.innerHTML = `

            <div class="status-content">

                <div class="status-title">
                    Error loading marketplace
                </div>

                <div class="status-text">

                    ${escapeHtml(
                        error.message
                    )}

                    <br><br>

                    Check whether
                    <strong>
                        arrays/ugcs
                    </strong>
                    has public read access
                    in the Firestore rules.

                </div>

            </div>

        `;


        previewStatus.textContent =
            "Error";

    }

}


/* ============================================================
   RENDER
============================================================ */

function renderizarItens(
    items
) {

    ugcList.innerHTML =
        "";


    itemCount.textContent =
        items.length;


    if (
        !items.length
    ) {

        ugcList.innerHTML = `

            <div class="status">

                <div class="status-content">

                    <div class="status-title">
                        No UGCs found
                    </div>

                    <div class="status-text">
                        Search by name or
                        enter a Roblox Asset ID
                        to query the API.
                    </div>

                </div>

            </div>

        `;

        return;

    }


    items.forEach(
        (item, index) => {

            ugcList.appendChild(
                criarCard(
                    item,
                    index
                )
            );

        }
    );

}


/* ============================================================
   CARD
============================================================ */

function criarCard(
    item,
    index
) {

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "ugc-card";


    const thumbnail =
        item.thumbnail;


    const badge =
        item.origem === "api"

            ? `
                <div class="badge api">
                    API • REAL-TIME
                </div>
            `

            : `
                <div class="badge saved">
                    REGISTERED
                </div>
            `;


    let thumbnailHtml;


    if (thumbnail) {

        thumbnailHtml = `

            <img
                src="${escapeHtml(thumbnail)}"
                alt="${escapeHtml(item.nome)}"
                loading="lazy"
            >

        `;

    } else {

        thumbnailHtml = `

            <div class="thumbnail-placeholder">
                Loading...
            </div>

        `;

    }


    const preco =
        item.preco !== null &&
        item.preco !== undefined

            ? `${escapeHtml(item.preco)} Robux`

            : "Price unavailable";


    card.innerHTML = `

        <div class="ugc-thumbnail">

            ${thumbnailHtml}

            ${badge}

            <div class="price">
                ${preco}
            </div>

        </div>


        <div class="card-content">

            <div class="ugc-name">
                ${escapeHtml(item.nome)}
            </div>


            <div class="ugc-id">
                ID: ${escapeHtml(
                    item.id || "N/A"
                )}
            </div>


            <div class="card-actions">

                <a
                    class="roblox-button"
                    href="${gerarLinkRoblox(item.id)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    View on Roblox
                </a>


                <button
                    class="details-button"
                    type="button"
                >
                    Details
                </button>

            </div>

        </div>

    `;


    const detailsButton =
        card.querySelector(
            ".details-button"
        );


    detailsButton.addEventListener(
        "click",
        () =>
            abrirDetalhes(item)
    );


    /*
     * If no thumbnail is available,
     * try to retrieve it through the API.
     */

    if (
        !thumbnail &&
        item.id
    ) {

        carregarThumbnailCard(
            item,
            card
        );

    }


    return card;

}


/* ============================================================
   CARD THUMBNAIL
============================================================ */

async function carregarThumbnailCard(
    item,
    card
) {

    const image =
        await buscarThumbnailRoblox(
            item.id
        );


    if (!image) {
        return;
    }


    item.thumbnail =
        image;


    const container =
        card.querySelector(
            ".ugc-thumbnail"
        );


    const price =
        container.querySelector(
            ".price"
        );


    const img =
        document.createElement(
            "img"
        );


    img.src =
        image;


    img.alt =
        item.nome;


    img.loading =
        "lazy";


    container.insertBefore(
        img,
        price
    );


    const placeholder =
        container.querySelector(
            ".thumbnail-placeholder"
        );


    if (placeholder) {

        placeholder.remove();

    }

}


/* ============================================================
   API — SEARCH BY ID
============================================================ */

async function pesquisarPorIdAPI(
    assetId
) {

    if (
        !/^\d+$/.test(
            assetId
        )
    ) {

        return null;

    }


    /*
     * First search for the EXACT ID
     * in Firestore.
     */

    const encontrado =
        allItems.find(
            item =>
                String(item.id) ===
                String(assetId)
        );


    if (encontrado) {

        return encontrado;

    }


    /*
     * The ID does not exist in Firestore.
     * Query the API in real time.
     */

    previewStatus.textContent =
        `Querying API: ${assetId}`;


    const data =
        await buscarUGC(
            assetId
        );


    if (!data) {
        return null;
    }


    /*
     * API response contains:
     *
     * data.AssetId
     * data.Name
     * data.Description
     * data.PriceInRobux
     * data.Creator
     * data.ProductType
     * data.CollectibleItemId
     * etc.
     */

    const item =
        normalizarItem(
            data,
            assetId,
            "api"
        );


    if (!item) {
        return null;
    }


    /*
     * If the API did not return a thumbnail,
     * retrieve it from the thumbnail endpoint.
     */

    if (
        !item.thumbnail
    ) {

        item.thumbnail =
            await buscarThumbnailRoblox(
                item.id
            );

    }


    return item;

}


/* ============================================================
   SHOW API RESULT
============================================================ */

function mostrarResultadoAPI(
    item
) {

    apiSearchItem =
        item;


    ugcList.innerHTML =
        "";


    ugcList.appendChild(
        criarCard(
            item,
            0
        )
    );


    itemCount.textContent =
        "1";


    previewStatus.textContent =
        "Result found through the real-time API";

}


/* ============================================================
   SHOW API NOT FOUND
============================================================ */

function mostrarNaoEncontrado(
    termo
) {

    ugcList.innerHTML = `

        <div class="status">

            <div class="status-content">

                <div class="status-title">
                    UGC not found
                </div>

                <div class="status-text">

                    The ID
                    <strong>
                        ${escapeHtml(termo)}
                    </strong>
                    is not registered
                    in ADN Market and was also
                    not found by the API.

                </div>

            </div>

        </div>

    `;


    itemCount.textContent =
        "0";


    previewStatus.textContent =
        "No results";

}


/* ============================================================
   SEARCH
============================================================ */

async function pesquisar() {

    const termo =
        searchInput.value
            .trim();


    /*
     * Empty search.
     */

    if (!termo) {

        apiSearchItem =
            null;


        renderizarItens(
            allItems
        );


        previewStatus.textContent =
            `${allItems.length} registered items`;


        return;

    }


    /*
     * ========================================================
     * ROBLOX ID
     * ========================================================
     */

    if (
        /^\d+$/.test(
            termo
        )
    ) {

        /*
         * EXACT ID in Firestore.
         */

        const exact =
            allItems.find(
                item =>
                    String(item.id) ===
                    termo
            );


        if (exact) {

            apiSearchItem =
                null;


            renderizarItens(
                [exact]
            );


            previewStatus.textContent =
                "UGC found in ADN Market";


            return;

        }


        /*
         * ID does not exist in Firestore.
         *
         * Now query the API.
         */

        ugcList.innerHTML = `

            <div class="status">

                <div class="status-content">

                    <div class="loading-spinner"></div>

                    <div class="status-title">
                        Querying UGC
                    </div>

                    <div class="status-text">

                        Searching for ID
                        <strong>
                            ${escapeHtml(termo)}
                        </strong>
                        directly through the API...

                    </div>

                </div>

            </div>

        `;


        itemCount.textContent =
            "—";


        previewStatus.textContent =
            "Real-time API";


        try {

            const item =
                await pesquisarPorIdAPI(
                    termo
                );


            /*
             * Prevent an old response
             * from appearing after the user
             * changes the search.
             */

            if (
                searchInput.value.trim() !==
                termo
            ) {

                return;

            }


            if (item) {

                mostrarResultadoAPI(
                    item
                );

                return;

            }


            mostrarNaoEncontrado(
                termo
            );


        } catch (error) {

            /*
             * AbortError means that
             * a new search replaced
             * the previous one.
             */

            if (
                error?.name ===
                "AbortError"
            ) {

                return;

            }


            console.error(
                "[ADN Market] API error:",
                error
            );


            ugcList.innerHTML = `

                <div class="status">

                    <div class="status-content">

                        <div class="status-title">
                            Query error
                        </div>

                        <div class="status-text">

                            Unable to
                            query the API right now.

                            <br><br>

                            ${escapeHtml(
                                error.message
                            )}

                        </div>

                    </div>

                </div>

            `;


            itemCount.textContent =
                "0";


            previewStatus.textContent =
                "API error";

        }


        return;

    }


    /*
     * ========================================================
     * SEARCH BY NAME
     * ========================================================
     */

    const termoLower =
        termo.toLowerCase();


    const filtrados =
        allItems.filter(
            item => {

                const nome =
                    String(
                        item.nome || ""
                    ).toLowerCase();


                const id =
                    String(
                        item.id || ""
                    ).toLowerCase();


                return (
                    nome.includes(
                        termoLower
                    ) ||
                    id.includes(
                        termoLower
                    )
                );

            }
        );


    apiSearchItem =
        null;


    renderizarItens(
        filtrados
    );


    previewStatus.textContent =
        `${filtrados.length} results`;

}


/* ============================================================
   INPUT
============================================================ */

searchInput.addEventListener(
    "input",
    () => {

        clearTimeout(
            searchTimer
        );


        /*
         * Cancel the previous request
         * immediately.
         */

        if (
            apiRequestController
        ) {

            apiRequestController.abort();

            apiRequestController =
                null;

        }


        searchTimer =
            setTimeout(
                pesquisar,
                400
            );

    }
);


/* ============================================================
   CLEAR
============================================================ */

clearSearch.addEventListener(
    "click",
    () => {

        clearTimeout(
            searchTimer
        );


        if (
            apiRequestController
        ) {

            apiRequestController.abort();

            apiRequestController =
                null;

        }


        searchInput.value =
            "";


        apiSearchItem =
            null;


        renderizarItens(
            allItems
        );


        previewStatus.textContent =
            `${allItems.length} registered items`;


        searchInput.focus();

    }
);


/* ============================================================
   ROBLOX LINK
============================================================ */

function gerarLinkRoblox(
    assetId
) {

    if (!assetId) {
        return "#";
    }


    return (
        "https://www.roblox.com/catalog/" +
        encodeURIComponent(assetId)
    );

}


/* ============================================================
   ADN MARKET LINK
============================================================ */

function gerarLinkMarket(
    assetId
) {

    if (!assetId) {
        return "#";
    }


    return (
        `${API_BASE_URL}/market/` +
        encodeURIComponent(assetId)
    );

}


/* ============================================================
   MODAL
============================================================ */

function abrirDetalhes(
    item
) {

    modalTitle.textContent =
        item.nome;


    modalImage.src =
        item.thumbnail || "";


    modalImage.alt =
        item.nome;


    modalDetails.innerHTML =
        "";


    /*
     * Origin
     */

    adicionarDetalhe(
        "Origin",
        item.origem === "api"
            ? "Real-time API"
            : "ADN Market / Firestore"
    );


    /*
     * Basic data
     */

    adicionarDetalhe(
        "Name",
        item.nome
    );


    adicionarDetalhe(
        "Asset ID",
        item.id
    );


    if (
        item.preco !== null &&
        item.preco !== undefined
    ) {

        adicionarDetalhe(
            "Price",
            `${item.preco} Robux`
        );

    }


    const dados =
        item.original || {};


    /*
     * ========================================================
     * DIRECT ROBLOX API DATA
     * ========================================================
     */

    if (
        dados.Creator
    ) {

        adicionarDetalhe(
            "Creator",
            dados.Creator.Name ||
            dados.Creator.Id ||
            "N/A"
        );


        if (
            dados.Creator.CreatorType
        ) {

            adicionarDetalhe(
                "Creator Type",
                dados.Creator.CreatorType
            );

        }

    }


    if (
        dados.ProductType
    ) {

        adicionarDetalhe(
            "Product Type",
            dados.ProductType
        );

    }


    if (
        dados.AssetTypeId
    ) {

        adicionarDetalhe(
            "Asset Type ID",
            dados.AssetTypeId
        );

    }


    if (
        dados.ProductId
    ) {

        adicionarDetalhe(
            "Product ID",
            dados.ProductId
        );

    }


    if (
        dados.CollectibleItemId
    ) {

        adicionarDetalhe(
            "Collectible Item ID",
            dados.CollectibleItemId
        );

    }


    if (
        dados.CollectibleProductId
    ) {

        adicionarDetalhe(
            "Collectible Product ID",
            dados.CollectibleProductId
        );

    }


    if (
        dados.IsForSale !== undefined
    ) {

        adicionarDetalhe(
            "For Sale",
            dados.IsForSale
        );

    }


    if (
        dados.IsLimited !== undefined
    ) {

        adicionarDetalhe(
            "Limited",
            dados.IsLimited
        );

    }


    if (
        dados.IsLimitedUnique !== undefined
    ) {

        adicionarDetalhe(
            "Limited Unique",
            dados.IsLimitedUnique
        );

    }


    if (
        dados.Sales !== undefined
    ) {

        adicionarDetalhe(
            "Sales",
            dados.Sales
        );

    }


    if (
        dados.Remaining !== undefined
    ) {

        adicionarDetalhe(
            "Remaining",
            dados.Remaining
        );

    }


    if (
        dados.Created
    ) {

        adicionarDetalhe(
            "Created",
            formatarData(
                dados.Created
            )
        );

    }


    if (
        dados.Updated
    ) {

        adicionarDetalhe(
            "Updated",
            formatarData(
                dados.Updated
            )
        );

    }


    /*
     * Description
     */

    if (
        dados.Description
    ) {

        adicionarDetalhe(
            "Description",
            dados.Description
        );

    }


    /*
     * Roblox
     */

    adicionarDetalhe(
        "Roblox",
        `
            <a
                href="${gerarLinkRoblox(item.id)}"
                target="_blank"
                rel="noopener noreferrer"
                style="
                    color: var(--primary);
                    font-weight: 700;
                "
            >
                Open item
            </a>
        `,
        true
    );


    /*
     * ADN Market
     */

    adicionarDetalhe(
        "ADN Market",
        `
            <a
                href="${gerarLinkMarket(item.id)}"
                target="_blank"
                rel="noopener noreferrer"
                style="
                    color: var(--success);
                    font-weight: 700;
                "
            >
                Open page
            </a>
        `,
        true
    );


    modal.classList.add(
        "active"
    );

}


/* ============================================================
   DATE
============================================================ */

function formatarData(
    value
) {

    try {

        const data =
            new Date(
                value
            );


        if (
            Number.isNaN(
                data.getTime()
            )
        ) {

            return value;

        }


        return data.toLocaleString(
            "en-US"
        );

    } catch {

        return value;

    }

}


/* ============================================================
   ADD DETAIL
============================================================ */

function adicionarDetalhe(
    label,
    value,
    html = false
) {

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "detail-row";


    const labelElement =
        document.createElement(
            "div"
        );


    labelElement.className =
        "detail-label";


    labelElement.textContent =
        label;


    const valueElement =
        document.createElement(
            "div"
        );


    valueElement.className =
        "detail-value";


    if (html) {

        valueElement.innerHTML =
            value;

    } else {

        valueElement.textContent =
            formatValue(
                value
            );

    }


    row.appendChild(
        labelElement
    );


    row.appendChild(
        valueElement
    );


    modalDetails.appendChild(
        row
    );

}


/* ============================================================
   CLOSE MODAL
============================================================ */

function fecharModal() {

    modal.classList.remove(
        "active"
    );

}


closeModal.addEventListener(
    "click",
    fecharModal
);


modal.addEventListener(
    "click",
    event => {

        if (
            event.target === modal
        ) {

            fecharModal();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            fecharModal();

        }

    }
);


/* ============================================================
   START
============================================================ */

carregarMercado();

</script>
